[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-agent"
version = "0.1.0"
description = "Local-first personal AI agent for Windows (Phase 1: Local AI Core)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32,<3",
    "PySide6>=6.7,<7",
    "psutil>=6.0,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
